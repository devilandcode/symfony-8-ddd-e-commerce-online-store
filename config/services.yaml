# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Customer\Domain\Repository\UserRepositoryInterface:
        alias: App\Customer\Infrastructure\Persistence\Doctrine\UserRepository

    App\ContentManagement\Domain\Repository\PageRepositoryInterface:
        alias: App\ContentManagement\Infrastructure\Persistence\Doctrine\PageRepository

    App\ContentManagement\Domain\Repository\PageContentRepositoryInterface:
        alias: App\ContentManagement\Infrastructure\Persistence\Doctrine\PageContentRepository

    App\ContentManagement\Domain\Repository\SiteMenuRepositoryInterface:
        alias: App\ContentManagement\Infrastructure\Persistence\Doctrine\SiteMenuRepository

    App\Catalog\Domain\Repository\CategoryRepositoryInterface:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\CategoryRepository

    App\Catalog\Domain\Repository\CharacteristicRepositoryInterface:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\CharacteristicRepository

    App\Catalog\Domain\Repository\BrandRepositoryInterface:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\BrandRepository

    App\Catalog\Domain\Repository\ProductRepositoryInterface:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\ProductRepository

    App\Storefront\Application\HomePage\Interface\HomePageCatalogQueryInterface:
        alias: App\Storefront\Infrastructure\Persistence\Doctrine\HomePageCatalogRepository

    App\Storefront\Application\CatalogPage\Interface\CatalogPageQueryInterface:
        alias: App\Storefront\Infrastructure\Persistence\Doctrine\CatalogPageQuery

    App\Catalog\Application\Product\AdminUseCases\ListProducts\ProductIndexQueryInterface:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\DoctrineProductIndexQuery

    App\Customer\Application\PasswordHasherInterface:
        alias: App\Customer\Infrastructure\Security\SymfonyPasswordHasher

    App\Shared\Application\FlusherInterface:
        alias: App\Shared\Infrastructure\Persistence\DoctrineFlusher

    App\Cart\Domain\Repository\CartRepositoryInterface:
        alias: App\Cart\Infrastructure\Persistence\Doctrine\CartRepository

    App\Cart\Application\Interface\CartOwnerProviderInterface:
        alias: App\Cart\Infrastructure\Session\SessionCartOwnerProvider

    App\Cart\Application\Interface\PurchasableProductProviderInterface:
        alias: App\Cart\Infrastructure\Catalog\CatalogPurchasableProductProvider

    App\Cart\Application\Interface\CartProductProviderInterface:
        alias: App\Cart\Infrastructure\Catalog\CatalogCartProductProvider

    App\Storefront\Infrastructure\Http\EventListener\KernelExceptionEventListener:
        tags:
            - {
                name: kernel.event_listener,
                event: kernel.exception,
                method: onKernelException
            }

    App\Storefront\Infrastructure\Http\EventListener\CartExceptionEventListener:
        tags:
            - {
                name: kernel.event_listener,
                event: kernel.exception,
                priority: 10,
                method: onKernelException
            }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
